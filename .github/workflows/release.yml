name: Release

on:
  push:
    tags:
        - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/unity-worker/requirements.txt
            tools/unity-worker/requirements-dev.txt

      - name: Prepare Unity worker environment
        shell: pwsh
        run: |
          python -m venv tools/unity-worker/.venv

          & "tools/unity-worker/.venv/Scripts/python.exe" `
            -m pip install `
            --disable-pip-version-check `
            -r tools/unity-worker/requirements-dev.txt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag matches package version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"

          if ($env:RELEASE_TAG -ne "v$packageVersion") {
            throw "Tag $env:RELEASE_TAG does not match package version v$packageVersion."
          }

      - name: Build Windows installer
        shell: pwsh
        run: pnpm dist

      - name: Prepare release notes and append installer checksum
        id: notes
        shell: pwsh
        run: |
          $tagFile = ".github/release-notes/$env:RELEASE_TAG.md"
          $outputFile = Join-Path $env:RUNNER_TEMP "release-notes.md"

          if (Test-Path -LiteralPath $tagFile -PathType Leaf) {
            Copy-Item -LiteralPath $tagFile -Destination $outputFile
          } else {
            New-Item -ItemType File -Path $outputFile -Force | Out-Null
          }

          $metadataFiles = @(
            Get-ChildItem -LiteralPath "release" `
              -Filter "latest*.yml" `
              -File
          )

          if ($metadataFiles.Count -ne 1) {
            throw "Expected exactly one electron-builder update metadata file, but found $($metadataFiles.Count)."
          }

          $metadataFile = $metadataFiles[0]

          $pathMatches = @(
            Select-String `
              -LiteralPath $metadataFile.FullName `
              -Pattern '^path:\s*(.+?)\s*$'
          )

          $checksumMatches = @(
            Select-String `
              -LiteralPath $metadataFile.FullName `
              -Pattern '^sha512:\s*(.+?)\s*$'
          )

          if ($pathMatches.Count -ne 1) {
            throw "Could not determine the installer path from $($metadataFile.Name)."
          }

          if ($checksumMatches.Count -ne 1) {
            throw "Could not determine the installer checksum from $($metadataFile.Name)."
          }

          $artifactName = $pathMatches[0].Matches[0].Groups[1].Value.Trim()
          $checksum = $checksumMatches[0].Matches[0].Groups[1].Value.Trim()
          $artifactPath = Join-Path "release" $artifactName

          if (-not (Test-Path -LiteralPath $artifactPath -PathType Leaf)) {
            throw "The installer declared by electron-builder does not exist: $artifactPath"
          }

          Add-Content -LiteralPath $outputFile -Value @(
            ""
            "## Installer checksum"
            ""
            ('- File: `{0}`' -f $artifactName)
            ('- SHA-512 (Base64): `{0}`' -f $checksum)
          )

          "path=$outputFile" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}